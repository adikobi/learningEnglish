<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>כיף עם אנגלית - למעין</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #FF6B6B;
            --secondary-color: #4ECDC4;
            --accent-color: #FFE66D;
            --text-color: #2D3436;
            --card-bg: #FFFFFF;
            --success-color: #2ECC71;
            --error-color: #FF5252;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rubik', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            color: var(--text-color);
            overflow-x: hidden;
            /* Prevent scrolling on mobile game view */
            overflow-y: auto; 
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            position: relative;
            /* Ensure container fits on screen */
            max-height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 12px; 
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary-color), var(--success-color));
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 10px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px 12px;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }

        .stat-group {
            display: flex;
            gap: 12px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 1rem;
            font-weight: bold;
        }

        /* Controls inside header for settings */
        .settings-group {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .score-icon { font-size: 1.2rem; }
        
        /* Game Area */
        .game-area {
            text-align: center;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1; /* Allow game area to take remaining space */
        }

        .word-display {
            background: white;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            position: relative;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 140px; 
            justify-content: center;
            flex-shrink: 0;
        }

        .word-display:hover {
            transform: translateY(-5px);
            border-color: var(--secondary-color);
        }

        .english-word-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 5px;
            width: 100%;
        }

        .english-word {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-color);
            cursor: pointer;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.05);
            line-height: 1.2;
            transition: font-size 0.3s ease, opacity 0.3s ease;
            direction: ltr;
            unicode-bidi: isolate;
        }
        
        /* Hidden word for Listening Mode */
        .english-word.hidden-word {
            opacity: 0;
            pointer-events: none;
            position: absolute;
        }

        /* Big Speaker Icon for Listening Mode */
        .big-speaker-icon {
            font-size: 4.5rem;
            cursor: pointer;
            animation: pulse 2s infinite;
            display: none;
            margin: 10px;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .english-word.sentence-mode {
            font-size: 1.8rem; /* Adjusted for mobile */
        }

        .word-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-btn {
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: all 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .speaker-btn {
            background: var(--accent-color);
        }

        .hint-btn {
            background: #dfe6e9;
            color: #636e72;
        }

        .hint-btn:hover {
            background: #b2bec3;
            transform: scale(1.05);
        }

        /* Translation area */
        .translation-area {
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .translation-hint {
            font-size: 1.8rem;
            color: var(--text-color);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            transform: translateY(5px);
            font-weight: bold;
        }

        .translation-hint.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Force 2 columns on mobile */
            gap: 10px;
            margin-bottom: 10px;
            flex-grow: 1; /* Allow grid to expand */
            align-content: center; /* Center items vertically if extra space */
        }

        .option-card {
            background: white;
            border: 3px solid #f0f0f0;
            border-radius: 15px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1.1; 
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent; /* Remove tap highlight on mobile */
        }

        .option-emoji {
            font-size: 3rem;
            z-index: 2;
        }

        /* Hover effect only for devices that support hover (mouse) */
        @media (hover: hover) {
            .option-card:hover {
                transform: scale(1.02);
                border-color: var(--secondary-color);
                box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            }
        }
        
        /* Active state for touch feedback on mobile */
        .option-card:active {
            transform: scale(0.95);
            border-color: var(--secondary-color);
        }

        .option-card.correct {
            background: #d4edda;
            border-color: var(--success-color);
            animation: bounce 0.6s;
        }

        .option-card.wrong {
            background: #f8d7da;
            border-color: var(--error-color);
            animation: shake 0.5s;
        }

        /* Controls */
        .controls-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            margin-top: 5px;
            padding-top: 10px;
            border-top: 2px solid #f0f0f0;
            flex-shrink: 0;
        }

        .btn {
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 3px 0 rgba(0,0,0,0.1);
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .btn-primary {
            background: var(--secondary-color);
            color: white;
            width: 100%;
            font-size: 1.3rem;
            padding: 14px;
        }

        .btn-secondary {
            background: white;
            color: var(--text-color);
            border: 2px solid #e0e0e0;
            font-size: 0.9rem;
            flex: 1; /* Distribute space evenly */
        }

        .btn-secondary.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* Select styling */
        .custom-select {
            padding: 6px 10px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            font-size: 0.9rem;
            background: white;
            cursor: pointer;
            outline: none;
            font-family: 'Rubik', sans-serif;
            min-width: 100px;
        }

        .custom-select.mode-select {
            border-color: var(--primary-color);
            color: var(--primary-color);
            font-weight: bold;
        }

        /* Toggle Button Specifics */
        .toggle-btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: space-between;
        }

        /* Feedback Message */
        .feedback-msg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--success-color);
            z-index: 100;
            pointer-events: none;
            text-align: center;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 80%;
        }

        .feedback-msg.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        /* Animations */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }

        @keyframes shake {
            0%, 100% {transform: translateX(0);}
            10%, 30%, 50%, 70%, 90% {transform: translateX(-5px);}
            20%, 40%, 60%, 80% {transform: translateX(5px);}
        }

        /* Mobile Adjustments specific for small screens */
        @media (max-width: 600px) {
            .container { 
                padding: 10px; 
                border-radius: 15px; 
                height: 100vh;
            }
            .english-word { font-size: 2.5rem; }
            .english-word.sentence-mode { font-size: 1.5rem; } 
            .option-emoji { font-size: 2.8rem; }
            .stats-bar { flex-direction: row; justify-content: space-between; font-size: 0.9rem; }
            .settings-group { width: 100%; justify-content: space-between; margin-top: 5px; }
            .custom-select { width: 48%; min-width: auto; }
            .btn-primary { 
                /* Removed sticky positioning to keep it within flow */
                margin-bottom: 0;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            }
            .progress-container {
                /* Ensure visibility */
                min-height: 10px;
                background-color: #ddd;
            }
        }
        
        /* Desktop adjustments */
        @media (min-width: 601px) {
            .options-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .controls-area {
                flex-direction: row;
                align-items: center;
            }
            .btn-primary {
                width: auto;
                flex-grow: 2;
                margin-bottom: 0;
            }
            .toggle-btn-group {
                width: auto;
                gap: 10px;
            }
        }
    </style>
</head>

                    <div class="word-actions" id="action-buttons">

                        <button class="action-btn hint-btn" id="hint-btn" onclick="showHint()" title="קבל רמז (תרגום)">💡</button>
                    </div>
                </div>
                
                <!-- Translation Area -->

                </div>
            </div>

            <div class="options-grid" id="options-grid">

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, gainValue = 0.1) {
            if (!isSfxEnabled) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            // Start loud and fade out quickly
            gain.gain.setValueAtTime(gainValue, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playSuccessSound() {
            // Ding-Dong effect
            playTone(600, 'sine', 0.1, 0.2);
            setTimeout(() => playTone(800, 'sine', 0.2, 0.2), 100);
        }

        function playErrorSound() {
            playTone(200, 'sawtooth', 0.3, 0.2);
            setTimeout(() => playTone(150, 'sawtooth', 0.3, 0.2), 150);
        }

        function playLevelUpSound() {
            if (!isSfxEnabled) return;
            [400, 500, 600, 800].forEach((freq, i) => {
                setTimeout(() => playTone(freq, 'square', 0.2, 0.2), i * 150);
            });
        }

        // Improved Blank Sound: Louder "Pop"
        function playBlankSound() {
            if (!isSfxEnabled) return;
            // Short, punchy sine wave at 400Hz (triangle is a bit softer, lets use sine with higher volume)
            playTone(400, 'sine', 0.15, 0.3); 
        }

        // --- Logic ---
        function getFilteredWords() {
            const category = document.getElementById('category-select-visible').value;
            const levelStr = document.getElementById('level-select').value;
            
            let filtered = wordsDB;

            if (category !== 'all') {
                filtered = filtered.filter(w => w.category === category);
            }

            if (levelStr === 'basic') {
                filtered = filtered.filter(w => w.level === 1);
            } else if (levelStr === 'advanced') {
                filtered = filtered.filter(w => w.level === 2);
            }

            return filtered;
        }

        function getRandomWord() {
            const filtered = getFilteredWords();
            if (filtered.length === 0) return wordsDB[Math.floor(Math.random() * wordsDB.length)];
            return filtered[Math.floor(Math.random() * filtered.length)];
        }

        function getRandomSentence() {
            return sentencesDB[Math.floor(Math.random() * sentencesDB.length)];
        }

        // Generate options depending on game mode
        function generateOptions() {
            if (gameMode === 'sentences') {
                // For sentences, currentWordObj IS the sentence object
                // We need to find the word object corresponding to the missing word to get its emoji
                const correctWordStr = currentWordObj.missing;
                const correctWordData = wordsDB.find(w => w.word === correctWordStr) || { word: correctWordStr, emoji: '❓' };
                
                let options = [correctWordData];
                
                // Add random distractors from ALL words
                let pool = wordsDB;
                let safety = 0;
                while (options.length < 4 && safety < 50) {
                    safety++;
                    const random = pool[Math.floor(Math.random() * pool.length)];
                    // Ensure the distractor is not the correct word and not already in options
                    if (random.word !== correctWordStr && !options.find(o => o.word === random.word)) {
                        options.push(random);
                    }
                }
                
                return options.sort(() => Math.random() - 0.5);
            } else {
                // Word mode
                const filtered = getFilteredWords();
                const numOptions = 4;
                const options = [currentWordObj];
                let pool = filtered.length >= numOptions ? filtered : wordsDB;

                let safety = 0;
                while (options.length < numOptions && safety < 50) {
                    safety++;
                    const random = pool[Math.floor(Math.random() * pool.length)];
                    if (!options.find(o => o.word === random.word)) {
                        options.push(random);
                    }
                }
                return options.sort(() => Math.random() - 0.5);
            }
        }

        function renderOptionsGrid(options) {
             const grid = document.getElementById('options-grid');
             grid.innerHTML = '';
             // Use CSS Grid layout defined in styles
             
             options.forEach(opt => {
                 const card = document.createElement('div');
                 card.className = 'option-card';
                 // If sentence mode, options might have missing emojis if not in DB, handle gracefully
                 const displayEmoji = opt.emoji || '❓';
                 card.innerHTML = `<div class="option-emoji">${displayEmoji}</div>`;
                 card.onclick = () => checkAnswer(opt, card);
                 grid.appendChild(card);
             });
        }

        function initGame() {
            if (autoNextTimeout) {
                clearTimeout(autoNextTimeout);
                autoNextTimeout = null;
            }

            isAnswerReveal = false;
            isRefractoryPeriod = false;
            
            document.getElementById('hint-btn').style.display = 'flex';
            const transEl = document.getElementById('translation');
            const wordEl = document.getElementById('current-word');
            const speakerIcon = document.getElementById('big-speaker');
            const actionBtns = document.getElementById('action-buttons');

            // Reset Display state
            wordEl.classList.remove('hidden-word');
            speakerIcon.style.display = 'none';
            actionBtns.style.display = 'flex';
            
            // Mode Logic
            if (gameMode === 'sentences') {
                currentWordObj = getRandomSentence();
                updateDisplay(currentWordObj.display);
            } else {
                currentWordObj = getRandomWord();
                updateDisplay(currentWordObj.word);
            }

            // Listening Mode Overrides
            if (gameMode === 'listening') {
                wordEl.classList.add('hidden-word');
                speakerIcon.style.display = 'block';
                actionBtns.style.display = 'none'; // Hide small speaker/hint in listening mode initially
                // document.getElementById('hint-btn').style.display = 'none';
            }
            
            // Fix Flash
            transEl.style.transition = 'none';
            transEl.classList.remove('visible'); 
            transEl.style.opacity = '0';
            void transEl.offsetWidth;
            transEl.textContent = currentWordObj.translation;
            
            setTimeout(() => {
                transEl.style.transition = '';
                transEl.style.opacity = '';
            }, 50);

            // Render Options
            const options = generateOptions();
            renderOptionsGrid(options);

            // Auto-speak logic
            if(isAutoSpeechEnabled) {
                if (gameMode === 'words') {
                    setTimeout(() => speakCurrentWord(false), 500);
                } else if (gameMode === 'listening') {
                    // Always speak in listening mode, even if auto is off? 
                    // Usually listening mode implies auto-speak start, but let's respect the toggle or maybe force it once.
                    // Let's force it for listening mode as the user sees nothing.
                    setTimeout(() => speakCurrentWord(true), 500);
                }
            }
        }

        function updateDisplay(text) {
            const el = document.getElementById('current-word');
            el.textContent = text;
            
            if (gameMode === 'sentences') {
                el.classList.add('sentence-mode');
            } else {
                el.classList.remove('sentence-mode');
            }
        }
        
        function showHint() {
            if(isAnswerReveal) return;
            document.getElementById('translation').classList.add('visible');
        }

        function updateProgressBar() {
            const percentage = (levelProgress / 10) * 100;
            document.getElementById('progress-bar').style.width = percentage + '%';
        }
        
        function shuffleWrongAnswers() {
            const options = generateOptions();
            renderOptionsGrid(options);
            isRefractoryPeriod = false;
        }

        function checkAnswer(selectedOpt, cardElement) {
            if (isAnswerReveal || isRefractoryPeriod) return; 

            let isCorrect = false;
            if (gameMode === 'sentences') {
                // In sentence mode, selectedOpt is a word object, compare with missing word string
                if (selectedOpt.word === currentWordObj.missing) isCorrect = true;
            } else {
                if (selectedOpt.word === currentWordObj.word) isCorrect = true;
            }

            if (isCorrect) {
                // Correct
                isAnswerReveal = true;
                cardElement.classList.add('correct');
                document.getElementById('translation').classList.add('visible');
                
                // If sentence, fill the blank!
                if (gameMode === 'sentences') {
                    updateDisplay(currentWordObj.full);
                    if(isAutoSpeechEnabled) speakText(currentWordObj.full);
                } 
                // If listening mode, reveal word
                else if (gameMode === 'listening') {
                    document.getElementById('current-word').classList.remove('hidden-word');
                    document.getElementById('big-speaker').style.display = 'none';
                    document.getElementById('action-buttons').style.display = 'flex';
                    playSuccessSound();
                }
                else {
                    // Normal mode
                    playSuccessSound(); 
                }
                
                // Standard Success Logic
                if (gameMode !== 'sentences' && gameMode !== 'listening') playSuccessSound(); 
                else if (gameMode === 'sentences') setTimeout(playSuccessSound, 200); 

                score += 10;
                streak += 1;
                levelProgress += 1;
                
                if (levelProgress >= 10) {
                    playLevelUpSound();
                    showFeedback('כל הכבוד! שלב הושלם! 🏆');
                    confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
                    levelProgress = 0;
                } else {
                    showFeedback();
                    confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 }, colors: ['#FF6B6B', '#4ECDC4', '#FFE66D'] });
                }
                
                updateStats();
                updateProgressBar();
                autoNextTimeout = setTimeout(initGame, 2000); 
            } else {
                // Wrong
                cardElement.classList.add('wrong');
                playErrorSound();
                streak = 0;
                if (navigator.vibrate) navigator.vibrate(200);
                updateStats();
                
                isRefractoryPeriod = true;
                setTimeout(() => {
                    shuffleWrongAnswers();
                }, 1000);
            }
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('streak').textContent = streak;
        }

        function showFeedback(customText = null) {
            const msgs = ['מעולה!', 'כל הכבוד!', 'איזה יופי!', 'מצוין!', 'אלוף!'];
            const msg = customText || msgs[Math.floor(Math.random() * msgs.length)];
            const el = document.getElementById('feedback-msg');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        function speakText(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.8; 
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        // Modified speak function for mixed content
        function speakSentenceWithBlank(textBefore, textAfter) {
            // For forced clicks, we ignore the auto-speech toggle
            window.speechSynthesis.cancel();
            
            const utter1 = new SpeechSynthesisUtterance(textBefore);
            utter1.lang = 'en-US';
            utter1.rate = 0.8;
            
            utter1.onend = () => {
                playBlankSound();
                // We need a slight delay after sound before continuing speech
                setTimeout(() => {
                    if (textAfter && textAfter.trim().length > 0) {
                        const utter2 = new SpeechSynthesisUtterance(textAfter);
                        utter2.lang = 'en-US';
                        utter2.rate = 0.8;
                        window.speechSynthesis.speak(utter2);
                    }
                }, 400); // Wait for sound to finish roughly
            };
            
            window.speechSynthesis.speak(utter1);
        }

        function speakCurrentWord(force = false) {
            // Force bypasses the auto-check for manual clicks
            if (!force && !isAutoSpeechEnabled) return;
            
            if (gameMode === 'sentences') {
                if (isAnswerReveal) {
                     speakText(currentWordObj.full);
                } else {
                     // Split by the underscores
                     const parts = currentWordObj.display.split('___');
                     speakSentenceWithBlank(parts[0], parts[1]);
                }
            } else {
                speakText(currentWordObj.word);
            }
        }

        // --- Event Listeners ---
        document.getElementById('next-btn').addEventListener('click', initGame);
        
        const handleSettingsChange = () => {
            score = 0; 
            streak = 0;
            levelProgress = 0;
            updateStats();
            updateProgressBar();
            initGame();
        };

        // Handle Mode Change Specifically
        document.getElementById('game-mode-select').addEventListener('change', function() {
            if (this.value === 'adventure') {
                // Redirect to the new adventure mode page
                window.location.href = 'adventure.html';
                return;
            }
            gameMode = this.value;
            handleSettingsChange();
        });

        // Use the visible category select for mobile friendliness
        document.getElementById('category-select-visible').addEventListener('change', handleSettingsChange);
        document.getElementById('level-select').addEventListener('change', handleSettingsChange);

        document.getElementById('sfx-toggle').addEventListener('click', function() {
            isSfxEnabled = !isSfxEnabled;
            this.classList.toggle('active');
            this.querySelector('span').textContent = isSfxEnabled ? '🔔 צלילים' : '🔕 שקט';
            if (audioCtx.state === 'suspended') audioCtx.resume();
        });

        document.getElementById('auto-speech-toggle').addEventListener('click', function() {
            isAutoSpeechEnabled = !isAutoSpeechEnabled;
            this.classList.toggle('active');
            this.querySelector('span').textContent = isAutoSpeechEnabled ? '🗣️ אוטומטי' : '🙊 ידני';
        });

        window.addEventListener('load', () => {
            initGame();
            document.body.addEventListener('click', () => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }, {once:true});
        });

    </script>
</body>
</html>
