<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

        :root {
            --primary-color: #FF6B6B;
            --secondary-color: #4ECDC4;
            --accent-color: #FFE66D;
            --text-color: #2D3436;
            --card-bg: #FFFFFF;
            --success-color: #2ECC71;
            --error-color: #FF5252;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rubik', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            color: var(--text-color);
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            position: relative;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 15px;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary-color), var(--success-color));
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 10px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 10px 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat-group {
            display: flex;
            gap: 15px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* Controls inside header for settings */
        .settings-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .score-icon { font-size: 1.4rem; }
        
        /* Game Area */
        .game-area {
            text-align: center;
            padding: 5px;
        }

        .word-display {
            background: white;
            padding: 25px;
            border-radius: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            position: relative;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 200px;
            justify-content: center;
        }

        .word-display:hover {
            transform: translateY(-5px);
            border-color: var(--secondary-color);
        }

        .english-word-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            width: 100%;
        }

        .english-word {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--primary-color);
            cursor: pointer;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.05);
            line-height: 1.2;
            transition: font-size 0.3s ease, opacity 0.3s ease;
            direction: ltr;
            unicode-bidi: isolate;
        }
        
        /* Hidden word for Listening Mode */
        .english-word.hidden-word {
            opacity: 0;
            pointer-events: none;
            position: absolute; /* Hide from flow but keep DOM presence */
        }

        /* Big Speaker Icon for Listening Mode */
        .big-speaker-icon {
            font-size: 5rem;
            cursor: pointer;
            animation: pulse 2s infinite;
            display: none;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .english-word.sentence-mode {
            font-size: 2.2rem;
        }

        .word-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .action-btn {
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .speaker-btn {
            background: var(--accent-color);
        }

        .hint-btn {
            background: #dfe6e9;
            color: #636e72;
        }

        .hint-btn:hover {
            background: #b2bec3;
            transform: scale(1.05);
        }

        /* Translation area */
        .translation-area {
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .translation-hint {
            font-size: 2rem;
            color: var(--text-color);
            opacity: 0; /* Hidden by default */
            transition: opacity 0.3s, transform 0.3s;
            transform: translateY(10px);
            font-weight: bold;
        }

        .translation-hint.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-card {
            background: white;
            border: 3px solid #f0f0f0;
            border-radius: 20px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1;
            position: relative;
            overflow: hidden;
        }

        .option-emoji {
            font-size: 3.5rem;
            z-index: 2;
        }

        .option-card:hover {
            transform: scale(1.05);
            border-color: var(--secondary-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .option-card.correct {
            background: #d4edda;
            border-color: var(--success-color);
            animation: bounce 0.6s;
        }

        .option-card.wrong {
            background: #f8d7da;
            border-color: var(--error-color);
            animation: shake 0.5s;
        }

        /* Controls */
        .controls-area {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .btn {
            border: none;
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-primary {
            background: var(--secondary-color);
            color: white;
            width: 100%;
            justify-content: center;
            font-size: 1.3rem;
            padding: 15px;
            margin-bottom: 10px;
        }

        .btn-secondary {
            background: white;
            color: var(--text-color);
            border: 2px solid #e0e0e0;
        }

        .btn-secondary.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* Select styling */
        .custom-select {
            padding: 8px 12px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            font-size: 0.95rem;
            background: white;
            cursor: pointer;
            outline: none;
            font-family: 'Rubik', sans-serif;
            min-width: 120px;
        }

        .custom-select.mode-select {
            border-color: var(--primary-color);
            color: var(--primary-color);
            font-weight: bold;
        }

        /* Toggle Button Specifics */
        .toggle-btn-group {
            display: flex;
            gap: 10px;
        }

        /* Feedback Message */
        .feedback-msg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            font-size: 3rem;
            font-weight: 800;
            color: var(--success-color);
            z-index: 100;
            pointer-events: none;
            text-align: center;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .feedback-msg.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        /* Animations */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }

        @keyframes shake {
            0%, 100% {transform: translateX(0);}
            10%, 30%, 50%, 70%, 90% {transform: translateX(-5px);}
            20%, 40%, 60%, 80% {transform: translateX(5px);}
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .english-word { font-size: 2.5rem; }
            .english-word.sentence-mode { font-size: 1.8rem; }
            .option-emoji { font-size: 3rem; }
            .container { padding: 15px; border-radius: 20px; }
            .stats-bar { flex-direction: column; align-items: stretch; }
            .stat-group, .settings-group { justify-content: space-between; width: 100%; }
            .options-grid { grid-template-columns: repeat(2, 1fr); }
            .btn-primary { position: sticky; bottom: 10px; z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        }
    </style>
</head>

                </div>
            </div>
        </header>

        <!-- Main Game Area -->

                    <div class="word-actions" id="action-buttons">
                        <button class="action-btn speaker-btn" onclick="speakCurrentWord(true)" title="השמע">🔊</button>
                        <button class="action-btn hint-btn" id="hint-btn" onclick="showHint()" title="קבל רמז (תרגום)">💡</button>
                    </div>
                </div>
                
                <!-- Translation Area -->
                <div class="translation-area">
                    <div class="translation-hint" id="translation">שלום</div>
                </div>
            </div>

            <div class="options-grid" id="options-grid">
                <!-- Option cards will be injected here -->
            </div>

            <div class="controls-area">
                <button id="next-btn" class="btn btn-primary">
                    <span>הבא</span> ➡️

                    <button id="sfx-toggle" class="btn btn-secondary active" title="צלילים">
                        <span>🔔 צלילים</span>
                    </button>
                </div>
            </div>

            { full: "The Battery is full", missing: "Battery", display: "The ___ is full", translation: "הסוללה מלאה", options: ["Box", "Cup", "Bag"] },
            { full: "I give a Gift", missing: "Gift", display: "I give a ___", translation: "אני נותן מתנה", options: ["Box", "Toy", "Card"] },
            { full: "The Balloon goes up", missing: "Balloon", display: "The ___ goes up", translation: "הבלון עולה למעלה", options: ["Ball", "Bird", "Plane"] },
            { full: "I play the Piano", missing: "Piano", display: "I play the ___", translation: "אני מנגן בפסנתר", options: ["Guitar", "Drum", "Flute"] },
            { full: "I hit the Drum", missing: "Drum", display: "I hit the ___", translation: "אני מכה בתוף", options: ["Piano", "Guitar", "Bell"] }
        ];

        // --- State ---
        let currentWordObj = null;
        let score = 0;
        let streak = 0;
        let levelProgress = 0; 
        let isSfxEnabled = true;
        let isAutoSpeechEnabled = true;
        let isAnswerReveal = false;
        let autoNextTimeout = null;
        let isRefractoryPeriod = false; 
        
        // --- Audio Context ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, gainValue = 0.1) {
            if (!isSfxEnabled) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            // Start loud and fade out quickly
            gain.gain.setValueAtTime(gainValue, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playSuccessSound() {
            // Ding-Dong effect
            playTone(600, 'sine', 0.1, 0.2);
            setTimeout(() => playTone(800, 'sine', 0.2, 0.2), 100);
        }

        function playErrorSound() {
            playTone(200, 'sawtooth', 0.3, 0.2);
            setTimeout(() => playTone(150, 'sawtooth', 0.3, 0.2), 150);
        }

        function playLevelUpSound() {
            if (!isSfxEnabled) return;
            [400, 500, 600, 800].forEach((freq, i) => {
                setTimeout(() => playTone(freq, 'square', 0.2, 0.2), i * 150);
            });
        }

        // Improved Blank Sound: Louder "Pop"
        function playBlankSound() {
            if (!isSfxEnabled) return;
            // Short, punchy sine wave at 400Hz (triangle is a bit softer, lets use sine with higher volume)
            playTone(400, 'sine', 0.15, 0.3); 
        }

        // --- Logic ---
        function getFilteredWords() {
            const category = document.getElementById('category-select').value;
            const levelStr = document.getElementById('level-select').value;
            
            let filtered = wordsDB;

            if (category !== 'all') {
                filtered = filtered.filter(w => w.category === category);
            }

            if (levelStr === 'basic') {
                filtered = filtered.filter(w => w.level === 1);
            } else if (levelStr === 'advanced') {
                filtered = filtered.filter(w => w.level === 2);
            }

            return filtered;
        }

        function getRandomWord() {
            const filtered = getFilteredWords();
            if (filtered.length === 0) return wordsDB[Math.floor(Math.random() * wordsDB.length)];
            return filtered[Math.floor(Math.random() * filtered.length)];
        }

        function getRandomSentence() {
            return sentencesDB[Math.floor(Math.random() * sentencesDB.length)];
        }

        // Generate options depending on game mode
        function generateOptions() {
            if (gameMode === 'sentences') {
                // For sentences, currentWordObj IS the sentence object
                // We need to find the word object corresponding to the missing word to get its emoji
                const correctWordStr = currentWordObj.missing;
                const correctWordData = wordsDB.find(w => w.word === correctWordStr) || { word: correctWordStr, emoji: '❓' };
                
                let options = [correctWordData];
                
                // Add distractors
                currentWordObj.options.forEach(optStr => {
                    const optData = wordsDB.find(w => w.word === optStr) || { word: optStr, emoji: '' };
                    options.push(optData);
                });
                
                return options.sort(() => Math.random() - 0.5);
            } else {
                // Word mode
                const filtered = getFilteredWords();
                const numOptions = 4;
                const options = [currentWordObj];
                let pool = filtered.length >= numOptions ? filtered : wordsDB;

                let safety = 0;
                while (options.length < numOptions && safety < 50) {
                    safety++;
                    const random = pool[Math.floor(Math.random() * pool.length)];
                    if (!options.find(o => o.word === random.word)) {
                        options.push(random);
                    }
                }
                return options.sort(() => Math.random() - 0.5);
            }
        }

        function renderOptionsGrid(options) {
             const grid = document.getElementById('options-grid');
             grid.innerHTML = '';
             grid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(130px, 1fr))';
             
             options.forEach(opt => {
                 const card = document.createElement('div');
                 card.className = 'option-card';
                 // If sentence mode, options might have missing emojis if not in DB, handle gracefully
                 const displayEmoji = opt.emoji || '❓';
                 card.innerHTML = `<div class="option-emoji">${displayEmoji}</div>`;
                 card.onclick = () => checkAnswer(opt, card);
                 grid.appendChild(card);
             });
        }

        function initGame() {
            if (autoNextTimeout) {
                clearTimeout(autoNextTimeout);
                autoNextTimeout = null;
            }

            isAnswerReveal = false;
            isRefractoryPeriod = false;
            
            document.getElementById('hint-btn').style.display = 'flex';
            const transEl = document.getElementById('translation');
            const wordEl = document.getElementById('current-word');
            const speakerIcon = document.getElementById('big-speaker');
            const actionBtns = document.getElementById('action-buttons');

            // Reset Display state
            wordEl.classList.remove('hidden-word');
            speakerIcon.style.display = 'none';
            actionBtns.style.display = 'flex';
            
            // Mode Logic
            if (gameMode === 'sentences') {
                currentWordObj = getRandomSentence();
                updateDisplay(currentWordObj.display);
            } else {
                currentWordObj = getRandomWord();
                updateDisplay(currentWordObj.word);
            }

            // Listening Mode Overrides
            if (gameMode === 'listening') {
                wordEl.classList.add('hidden-word');
                speakerIcon.style.display = 'block';
                actionBtns.style.display = 'none'; // Hide small speaker/hint in listening mode initially
                // document.getElementById('hint-btn').style.display = 'none';
            }
            
            // Fix Flash
            transEl.style.transition = 'none';
            transEl.classList.remove('visible'); 
            transEl.style.opacity = '0';
            void transEl.offsetWidth;
            transEl.textContent = currentWordObj.translation;
            
            setTimeout(() => {
                transEl.style.transition = '';
                transEl.style.opacity = '';
            }, 50);

            // Render Options
            const options = generateOptions();
            renderOptionsGrid(options);

            // Auto-speak logic
            if(isAutoSpeechEnabled) {
                if (gameMode === 'words') {
                    setTimeout(() => speakCurrentWord(false), 500);
                } else if (gameMode === 'listening') {
                    // Always speak in listening mode, even if auto is off? 
                    // Usually listening mode implies auto-speak start, but let's respect the toggle or maybe force it once.
                    // Let's force it for listening mode as the user sees nothing.
                    setTimeout(() => speakCurrentWord(true), 500);
                }
            }
        }

        function updateDisplay(text) {
            const el = document.getElementById('current-word');
            el.textContent = text;
            
            if (gameMode === 'sentences') {
                el.classList.add('sentence-mode');
            } else {
                el.classList.remove('sentence-mode');
            }
        }
        
        function showHint() {
            if(isAnswerReveal) return;
            document.getElementById('translation').classList.add('visible');
        }

        function updateProgressBar() {
            const percentage = (levelProgress / 10) * 100;
            document.getElementById('progress-bar').style.width = percentage + '%';
        }
        
        function shuffleWrongAnswers() {
            const options = generateOptions();
            renderOptionsGrid(options);
            isRefractoryPeriod = false;
        }

        function checkAnswer(selectedOpt, cardElement) {
            if (isAnswerReveal || isRefractoryPeriod) return; 

            let isCorrect = false;
            if (gameMode === 'sentences') {
                // In sentence mode, selectedOpt is a word object, compare with missing word string
                if (selectedOpt.word === currentWordObj.missing) isCorrect = true;
            } else {
                if (selectedOpt.word === currentWordObj.word) isCorrect = true;
            }

            if (isCorrect) {
                // Correct
                isAnswerReveal = true;
                cardElement.classList.add('correct');
                document.getElementById('translation').classList.add('visible');
                
                // If sentence, fill the blank!
                if (gameMode === 'sentences') {
                    updateDisplay(currentWordObj.full);
                    if(isAutoSpeechEnabled) speakText(currentWordObj.full);
                } 
                // If listening mode, reveal word
                else if (gameMode === 'listening') {
                    document.getElementById('current-word').classList.remove('hidden-word');
                    document.getElementById('big-speaker').style.display = 'none';
                    document.getElementById('action-buttons').style.display = 'flex';
                    playSuccessSound();
                }
                else {
                    // Normal mode
                    playSuccessSound(); 
                }
                
                // Standard Success Logic
                if (gameMode !== 'sentences' && gameMode !== 'listening') playSuccessSound(); 
                else if (gameMode === 'sentences') setTimeout(playSuccessSound, 200); 

                score += 10;
                streak += 1;
                levelProgress += 1;
                
                if (levelProgress >= 10) {
                    playLevelUpSound();
                    showFeedback('כל הכבוד! שלב הושלם! 🏆');
                    confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
                    levelProgress = 0;
                } else {
                    showFeedback();
                    confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 }, colors: ['#FF6B6B', '#4ECDC4', '#FFE66D'] });
                }
                
                updateStats();
                updateProgressBar();
                autoNextTimeout = setTimeout(initGame, 2000); 
            } else {
                // Wrong
                cardElement.classList.add('wrong');
                playErrorSound();
                streak = 0;
                if (navigator.vibrate) navigator.vibrate(200);
                updateStats();
                
                isRefractoryPeriod = true;
                setTimeout(() => {
                    shuffleWrongAnswers();
                }, 1000);
            }
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('streak').textContent = streak;
        }

        function showFeedback(customText = null) {
            const msgs = ['מעולה!', 'כל הכבוד!', 'איזה יופי!', 'מצוין!', 'אלוף!'];
            const msg = customText || msgs[Math.floor(Math.random() * msgs.length)];
            const el = document.getElementById('feedback-msg');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 1500);
        }

        function speakText(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.8; 
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        // Modified speak function for mixed content
        function speakSentenceWithBlank(textBefore, textAfter) {
            // For forced clicks, we ignore the auto-speech toggle
            window.speechSynthesis.cancel();
            
            const utter1 = new SpeechSynthesisUtterance(textBefore);
            utter1.lang = 'en-US';
            utter1.rate = 0.8;
            
            utter1.onend = () => {
                playBlankSound();
                // We need a slight delay after sound before continuing speech
                setTimeout(() => {
                    if (textAfter && textAfter.trim().length > 0) {
                        const utter2 = new SpeechSynthesisUtterance(textAfter);
                        utter2.lang = 'en-US';
                        utter2.rate = 0.8;
                        window.speechSynthesis.speak(utter2);
                    }
                }, 400); // Wait for sound to finish roughly
            };
            
            window.speechSynthesis.speak(utter1);
        }

        function speakCurrentWord(force = false) {
            // Force bypasses the auto-check for manual clicks
            if (!force && !isAutoSpeechEnabled) return;
            
            if (gameMode === 'sentences') {
                if (isAnswerReveal) {
                     speakText(currentWordObj.full);
                } else {
                     // Split by the underscores
                     const parts = currentWordObj.display.split('___');
                     speakSentenceWithBlank(parts[0], parts[1]);
                }
            } else {
                speakText(currentWordObj.word);
            }
        }

        // --- Event Listeners ---
        document.getElementById('next-btn').addEventListener('click', initGame);
        
        const handleSettingsChange = () => {
            score = 0; 
            streak = 0;
            levelProgress = 0;
            updateStats();
            updateProgressBar();
            initGame();
        };

        // Handle Mode Change Specifically
        document.getElementById('game-mode-select').addEventListener('change', function() {
            gameMode = this.value;
            handleSettingsChange();
        });

        document.getElementById('category-select').addEventListener('change', handleSettingsChange);
        document.getElementById('level-select').addEventListener('change', handleSettingsChange);

        document.getElementById('sfx-toggle').addEventListener('click', function() {
            isSfxEnabled = !isSfxEnabled;
            this.classList.toggle('active');
            this.querySelector('span').textContent = isSfxEnabled ? '🔔 צלילים' : '🔕 שקט';
            if (audioCtx.state === 'suspended') audioCtx.resume();
        });

        document.getElementById('auto-speech-toggle').addEventListener('click', function() {
            isAutoSpeechEnabled = !isAutoSpeechEnabled;
            this.classList.toggle('active');
            this.querySelector('span').textContent = isAutoSpeechEnabled ? '🗣️ אוטומטי' : '🙊 ידני';
        });

        window.addEventListener('load', () => {
            initGame();
            document.body.addEventListener('click', () => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }, {once:true});
        });

    </script>
</body>
</html>
