<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Explorer - Kids English Adventure</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fredoka & Comic Neue -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght=700&family=Fredoka:wght=400;600;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Fredoka', 'Comic Neue', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow: hidden;
            background-color: #87CEEB;
        }

        /* Parallax Background Animation */
        @keyframes scrollBackground {
            0% { background-position-y: 0px; }
            100% { background-position-y: 1000px; }
        }

        .animated-path {
            background-image: radial-gradient(#a3e635 15%, transparent 16%), radial-gradient(#86efac 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }

        .moving-path {
            animation: scrollBackground 3s linear infinite;
        }

        /* Bounce Animations */
        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .animate-gentle-bounce {
            animation: gentleBounce 2s ease-in-out infinite;
        }

        @keyframes walkBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-8px) rotate(-4deg); }
            75% { transform: translateY(-8px) rotate(4deg); }
        }

        .animate-walk {
            animation: walkBounce 0.35s infinite;
        }

        @keyframes pulseSuccess {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.1); filter: brightness(1.2); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        .animate-success-pulse {
            animation: pulseSuccess 0.5s ease-out;
        }

        /* Custom Scrollbar for Shop */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="h-screen w-screen relative flex flex-col justify-between items-center bg-gradient-to-b from-sky-300 via-sky-200 to-emerald-100 overflow-hidden">

    <!-- Top Header / Navigation & Score -->

    <script>
        /* Web Audio API Sound Effects Synthesizer */
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playSuccess() {
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                // Arpeggio notes: C5, E5, G5, C6
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                osc.frequency.setValueAtTime(1046.50, now + 0.24);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.5);
            }

            playTryAgain() {
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(160, now + 0.25);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.25);
            }

            playCoin() {
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, now); // B5
                osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.3);
            }

            // Mask beep sound for blanks
            playBeep() {
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.15);
            }
        }

        class GameEngine {
            constructor() {
                this.coins = 0;
                this.currentIndex = 0;
                this.isAnimating = false;
                this.hasTriggeredShop10 = false;
                this.synth = window.speechSynthesis;
                this.deck = [];

                // Elements
                this.elPromptText = document.getElementById('prompt-text');
                this.elCoinCount = document.getElementById('coin-count');
                this.elLevelDisplay = document.getElementById('level-display');
                this.elCharContainer = document.getElementById('character-container');
                this.elAvatar = document.getElementById('avatar');
                this.elPathBg = document.getElementById('path-bg');
                this.elToast = document.getElementById('toast-message');

                this.elOptionLeft = document.getElementById('option-left');
                this.elOptionRight = document.getElementById('option-right');

                this.bindKeyboard();
            }

            init() {
                this.shuffleDeck();
                this.loadChallenge();
                shop.updateUI();
            }

            shuffleDeck() {
                // Fisher-Yates deck shuffle for randomized challenge ordering
                this.deck = Array.from({ length: CHALLENGES.length }, (_, i) => i);
                for (let i = this.deck.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.deck[i], this.deck[j]] = [this.deck[j], this.deck[i]];
                }
            }

            bindKeyboard() {
                window.addEventListener('keydown', (e) => {
                    if (this.isAnimating) return;
                    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                        this.moveLeft();
                    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                        this.moveRight();
                    }
                });
            }

            currentChallenge() {
                if (this.deck.length === 0) {
                    this.shuffleDeck();
                }
                const deckIndex = this.currentIndex % this.deck.length;
                if (deckIndex === 0 && this.currentIndex > 0) {
                    this.shuffleDeck(); // Reshuffle deck when cycling through all questions
                }
                const challengeIndex = this.deck[deckIndex];
                return CHALLENGES[challengeIndex];
            }

            loadChallenge() {
                const item = this.currentChallenge();

                // Format prompt text with stylized underline blank
                let formattedPrompt = item.prompt.replace('___', '<span class="inline-block border-b-4 border-indigo-500 text-indigo-600 px-3 min-w-[70px]">___</span>');
                this.elPromptText.innerHTML = formattedPrompt;

                // Options update
                document.getElementById('emoji-left').textContent = item.left.emoji;
                document.getElementById('text-left').textContent = item.left.text;

                document.getElementById('emoji-right').textContent = item.right.emoji;
                document.getElementById('text-right').textContent = item.right.text;

                // Reset Character position to center
                this.elCharContainer.style.transform = `translateX(0px)`;
                this.elAvatar.classList.remove('animate-walk');

                // Speak TTS prompt aloud
                setTimeout(() => {
                    this.speakCurrentPrompt();
                }, 300);
            }

            speakCurrentPrompt(revealedWord = null) {
                if (!this.synth) return;
                this.synth.cancel(); // Stop prior speech

                const item = this.currentChallenge();
                let spokenText = "";

                if (revealedWord) {
                    spokenText = item.prompt.replace('___', revealedWord);
                    const utterance = new SpeechSynthesisUtterance(spokenText);
                    utterance.rate = 0.85;
                    utterance.pitch = 1.1;
                    utterance.lang = 'en-US';
                    this.synth.speak(utterance);
                } else {
                    // Play text-to-speech, masking blank with a beep sound!
                    const parts = item.prompt.split('___');

                    // Speak first part
                    if (parts[0] && parts[0].trim().length > 0) {
                        const u1 = new SpeechSynthesisUtterance(parts[0]);
                        u1.rate = 0.85;
                        u1.pitch = 1.1;
                        u1.lang = 'en-US';
                        u1.onend = () => {
                            soundFX.playBeep();
                            setTimeout(() => {
                                if (parts[1] && parts[1].trim().length > 0) {
                                    const u2 = new SpeechSynthesisUtterance(parts[1]);
                                    u2.rate = 0.85;
                                    u2.pitch = 1.1;
                                    u2.lang = 'en-US';
                                    this.synth.speak(u2);
                                }
                            }, 200);
                        };
                        this.synth.speak(u1);
                    } else {
                        // blank is at the start
                        soundFX.playBeep();
                        setTimeout(() => {
                            if (parts[1] && parts[1].trim().length > 0) {
                                const u2 = new SpeechSynthesisUtterance(parts[1]);
                                u2.rate = 0.85;
                                u2.pitch = 1.1;
                                u2.lang = 'en-US';
                                this.synth.speak(u2);
                            }
                        }, 200);
                    }
                }
            }

            showToast(msg, isSuccess = true) {
                this.elToast.textContent = msg;
                this.elToast.className = `opacity-100 transform translate-y-0 transition-all duration-300 mt-3 px-6 py-2 rounded-full font-bold text-lg shadow-lg text-white ${isSuccess ? 'bg-emerald-500' : 'bg-amber-500'}`;

                setTimeout(() => {
                    this.elToast.className = 'opacity-0 transform translate-y-2 transition-all duration-300 mt-3 px-6 py-2 rounded-full font-bold text-lg shadow-lg text-white bg-slate-800/90';
                }, 1800);
            }

            moveLeft() {
                if (this.isAnimating) return;
                this.animateMove(-130, () => this.evaluateChoice('left'));
            }

            moveRight() {
                if (this.isAnimating) return;
                this.animateMove(130, () => this.evaluateChoice('right'));
            }

            animateMove(offsetPx, callback) {
                this.isAnimating = true;
                this.elAvatar.classList.add('animate-walk');
                this.elCharContainer.style.transform = `translateX(${offsetPx}px)`;

                setTimeout(() => {
                    this.elAvatar.classList.remove('animate-walk');
                    if (callback) callback();
                }, 450);
            }

            evaluateChoice(side) {
                const item = this.currentChallenge();

                if (side === item.correct) {
                    // Correct Choice!
                    soundFX.playSuccess();
                    this.coins += 2; // +2 coins per correct answer
                    this.elCoinCount.textContent = this.coins;
                    shop.updateUI();

                    // Pulse effect on chosen side
                    const targetEl = side === 'left' ? this.elOptionLeft : this.elOptionRight;
                    targetEl.classList.add('animate-success-pulse');
                    setTimeout(() => targetEl.classList.remove('animate-success-pulse'), 500);

                    // Show correct answer word inside prompt
                    const correctWord = item[side].text;
                    let revealedPrompt = item.prompt.replace('___', `<span class="inline-block border-b-4 border-emerald-500 text-emerald-600 px-3 font-extrabold min-w-[70px] scale-115 transition-transform">${correctWord}</span>`);
                    this.elPromptText.innerHTML = revealedPrompt;

                    // Speak the fully completed sentence
                    this.speakCurrentPrompt(correctWord);

                    // Confetti Burst
                    confetti({
                        particleCount: 50,
                        spread: 60,
                        origin: { y: 0.7 }
                    });

                    this.showToast("כל הכבוד! 🎉 +2 מטבעות", true);

                    // Forward Path Motion Animation
                    this.elPathBg.classList.add('moving-path');

                    setTimeout(() => {
                        this.elPathBg.classList.remove('moving-path');
                        this.currentIndex++;
                        this.elLevelDisplay.textContent = Math.floor(this.currentIndex / 3) + 1;

                        // Check Shop Trigger at 10 coins
                        if (this.coins >= 10 && !this.hasTriggeredShop10) {
                            this.hasTriggeredShop10 = true;
                            shop.openModal(true);
                        } else {
                            this.loadChallenge();
                            this.isAnimating = false;
                        }
                    }, 2500);

                } else {
                    // Incorrect Choice - Gentle Feedback
                    soundFX.playTryAgain();
                    this.showToast("נסה שוב! אתה יכול לעשות את זה! 💪", false);

                    // Reset back to center slowly
                    setTimeout(() => {
                        this.elCharContainer.style.transform = `translateX(0px)`;
                        this.isAnimating = false;
                    }, 800);
                }
            }

            choose(side) {
                if (side === 'left') this.moveLeft();
                else this.moveRight();
            }
        }

        class ShopSystem {
            constructor() {
                this.equipped = {
                    outfit: 'blue',
                    hat: 'none',
                    glasses: 'none'
                };

                this.owned = {
                    outfit: ['blue'],
                    hat: ['none'],
                    glasses: ['none']
                };

                this.modalEl = document.getElementById('shop-modal');
                this.badgeEl = document.getElementById('shop-badge');
            }

            openModal(isAutoTrigger = false) {
                this.updateUI();
                this.modalEl.classList.remove('hidden');
                setTimeout(() => {
                    this.modalEl.classList.remove('opacity-0');
                }, 10);
            }

            closeModal() {
                this.modalEl.classList.add('opacity-0');
                setTimeout(() => {
                    this.modalEl.classList.add('hidden');
                    if (game.isAnimating) {
                        game.loadChallenge();
                        game.isAnimating = false;
                    }
                }, 300);
            }

            buyOrEquip(category, itemId, price) {
                const isOwned = this.owned[category].includes(itemId);

                if (isOwned) {
                    // Equip Item
                    this.equipped[category] = itemId;
                    this.applyCosmetics();
                    this.updateUI();
                    soundFX.playCoin();
                } else {
                    // Check if enough coins
                    if (game.coins >= price) {
                        game.coins -= price;
                        game.elCoinCount.textContent = game.coins;
                        this.owned[category].push(itemId);
                        this.equipped[category] = itemId;

                        soundFX.playSuccess();
                        this.applyCosmetics();
                        this.updateUI();
                    } else {
                        soundFX.playTryAgain();
                        game.showToast("אין לך מספיק מטבעות עדיין!", false);
                    }
                }
            }

            applyCosmetics() {
                // Apply Outfit color to SVG
                const svgBody = document.getElementById('svg-body');
                if (this.equipped.outfit === 'blue') svgBody.setAttribute('fill', '#3b82f6');
                else if (this.equipped.outfit === 'red') svgBody.setAttribute('fill', '#ef4444');
                else if (this.equipped.outfit === 'gold') svgBody.setAttribute('fill', '#f59e0b');

                // Apply Hats
                document.getElementById('svg-hat-party').classList.toggle('hidden', this.equipped.hat !== 'party');
                document.getElementById('svg-hat-crown').classList.toggle('hidden', this.equipped.hat !== 'crown');
                document.getElementById('svg-hat-cowboy').classList.toggle('hidden', this.equipped.hat !== 'cowboy');

                // Apply Glasses
                document.getElementById('svg-glasses-cool').classList.toggle('hidden', this.equipped.glasses !== 'cool');
                document.getElementById('svg-glasses-star').classList.toggle('hidden', this.equipped.glasses !== 'star');
            }

            updateUI() {
                document.getElementById('shop-coin-count').textContent = game.coins;

                // Show notification badge if coins >= 10 and not visited shop
                if (game.coins >= 10) {
                    this.badgeEl.classList.remove('hidden');
                } else {
                    this.badgeEl.classList.add('hidden');
                }

                // Update item buttons state
                const categories = ['outfit', 'hat', 'glasses'];
                categories.forEach(cat => {
                    const buttons = document.querySelectorAll(`[id^="item-${cat}-"]`);
                    buttons.forEach(btn => {
                        const idParts = btn.id.split('-');
                        const itemId = idParts[2];
                        const isOwned = this.owned[cat].includes(itemId);
                        const isEquipped = this.equipped[cat] === itemId;

                        // Border highlights
                        if (isEquipped) {
                            btn.className = "shop-item border-4 border-purple-600 bg-purple-50 p-3 rounded-2xl flex flex-col items-center gap-1 shadow-md w-full";
                        } else if (isOwned) {
                            btn.className = "shop-item border-2 border-emerald-400 bg-emerald-50/50 p-3 rounded-2xl flex flex-col items-center gap-1 hover:border-purple-400 w-full";
                        } else {
                            btn.className = "shop-item border-2 border-slate-200 p-3 rounded-2xl flex flex-col items-center gap-1 hover:border-purple-400 w-full";
                        }

                        // Price / Status Label tag update
                        const tagEl = btn.querySelector('.price-tag') || btn.querySelector('span:last-child');
                        if (tagEl) {
                            if (isEquipped) {
                                tagEl.textContent = "פעיל ✨";
                                tagEl.className = "text-xs font-bold text-purple-700 bg-purple-200 px-2 py-0.5 rounded-full";
                            } else if (isOwned) {
                                tagEl.textContent = "לבוש 👕";
                                tagEl.className = "text-xs font-bold text-emerald-700 bg-emerald-200 px-2 py-0.5 rounded-full";
                            }
                        }
                    });
                });
            }
        }

        let game;
        let shop;

        window.onload = function() {
            game = new GameEngine();
            shop = new ShopSystem();

            game.init();
        };
